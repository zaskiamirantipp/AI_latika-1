<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Menu Kafe Modern</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1>☕ Kopi Senja Digital</h1>
    <p>Pilih menu favoritmu & tunjukkan pesanan ke kasir!</p>
  </header>

  <div class="container">
    <div class="categories">
      <button class="btn-category active" onclick="filterMenu('semua')">Semua</button>
      <button class="btn-category" onclick="filterMenu('makanan')">Makanan</button>
      <button class="btn-category" onclick="filterMenu('minuman')">Minuman</button>
      <button class="btn-category" onclick="filterMenu('camilan')">Camilan</button>
    </div>

    <main id="menu-container" class="menu-grid">
      <!-- Di-render oleh JavaScript -->
    </main>

    <aside class="cart-section">
      <h2>🛒 Ringkasan Pesanan</h2>
      <ul id="cart-list" class="cart-list"></ul>
      <div class="cart-total">
        <span>Total:</span>
        <strong id="total-price">Rp 0</strong>
      </div>
      <button class="btn-checkout" onclick="checkoutWA()">Pesan via WhatsApp / Kasir</button>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
